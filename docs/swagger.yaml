host: localhost:8080
info:
  contact: {}
  description: API para gestão de fluxo de caixa com relatórios de saldo líquido e
    faturamento esperado.
  title: CashFlow Manager API
  version: "1.0"
paths:
  /configuracoes/orcamento-reposicao:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.OrcamentoReposicaoResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Obter orçamento de reposição
      tags:
      - configuracoes
    put:
      consumes:
      - application/json
      parameters:
      - description: Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.AtualizarOrcamentoReposicaoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.OrcamentoReposicaoResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Atualizar orçamento de reposição
      tags:
      - configuracoes
  /lancamentos:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/internal_handler.LancamentoResponse'
              type: array
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Listar lançamentos
      tags:
      - lancamentos
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do lançamento
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CriarLancamentoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.LancamentoResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Criar lançamento
      tags:
      - lancamentos
  /relatorios/faturamento-esperado:
    get:
      parameters:
      - description: Quantidade de dias do horizonte
        in: query
        name: dias
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.FaturamentoEsperadoResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Obter faturamento esperado
      tags:
      - relatorios
  /relatorios/saldo-liquido:
    get:
      parameters:
      - description: Quantidade de dias do horizonte
        in: query
        name: dias
        required: true
        type: integer
      produces:
