      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SaldoLiquidoResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Obter saldo líquido
      tags:
      - relatorios
  /relatorios/vencidos:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/cashflow-manager_internal_model.Entry'
